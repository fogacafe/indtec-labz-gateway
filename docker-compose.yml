services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  catalog:
    build:
      context: .
      dockerfile: src/Catalog.Grpc/Containerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      - jaeger
    ports:
      - "5081:8080"

  gateway:
    build:
      context: .
      dockerfile: src/Gateway.Api/Containerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Catalog__Address: http://catalog:8080
      ConnectionStrings__Redis: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      - redis
      - jaeger
      - catalog
    ports:
      - "5080:8080"
