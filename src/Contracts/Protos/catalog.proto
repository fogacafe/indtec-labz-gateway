syntax = "proto3";

option csharp_namespace = "Indtec.Labz.Gateway.Contracts";

package catalog;

service Catalog {
  rpc GetProduct (GetProductRequest) returns (ProductReply);
}

message GetProductRequest {
  string id = 1;
}

message ProductReply {
  string id = 1;
  string name = 2;
  string category = 3;
  double price = 4;
}
